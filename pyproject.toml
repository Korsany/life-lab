[project]
name = "life-lab"
version = "0.1.0"
description = "Лаборатория клеточных автоматов"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyqt6>=6.7"]

[project.scripts]
life-lab = "life_lab.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/life_lab"]
